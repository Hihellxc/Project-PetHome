{% extends "base.html" %}
{% block title %}แก้ไขประกาศ - PetHome{% endblock %}

{% block content %}
<h2 class="mb-4">✏️ แก้ไขประกาศสัตว์เลี้ยง</h2>

<div class="form-panel">
  <form method="POST" action="{{ url_for('edit_pet', pet_id=pet.pet_id) }}" enctype="multipart/form-data" class="row g-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="col-md-6">
      <label class="form-label">ชื่อสัตว์</label>
      <input type="text" name="name" class="form-control" value="{{ pet.name }}" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">รูปสัตว์ (เลือกใหม่ถ้าต้องการเปลี่ยน)</label>
      <input type="file" name="image" class="form-control" accept="image/*">
      {% if pet.image %}
        <img src="{{ pet.image }}" class="mt-2 pet-image-small">
      {% endif %}
    </div>

    <div class="col-md-3">
      <label class="form-label">ประเภท</label>
      <select name="type" class="form-select" required>
        <option value="หมา" {% if pet.type == 'หมา' %}selected{% endif %}>หมา</option>
        <option value="แมว" {% if pet.type == 'แมว' %}selected{% endif %}>แมว</option>
      </select>
    </div>

    <div class="col-md-3">
      <label class="form-label" for="breed">พันธุ์</label>
      <input type="text" id="breed" name="breed" class="form-control" value="{{ pet.breed or '' }}"
             maxlength="100" placeholder="เช่น ไทย, โกลเด้นรีทรีฟเวอร์">
    </div>

    <div class="col-md-3">
      <label class="form-label">เพศ</label>
      <select name="gender" class="form-select" required>
        <option value="ผู้" {% if pet.gender == 'ผู้' %}selected{% endif %}>ผู้</option>
        <option value="เมีย" {% if pet.gender == 'เมีย' %}selected{% endif %}>เมีย</option>
      </select>
    </div>

    <div class="col-md-3">
      <label class="form-label">อายุ (ปี)</label>
      <input type="number" name="age_years" class="form-control" value="{{ pet.age_years }}" min="0" required>
    </div>

    <div class="col-md-3">
      <label class="form-label">อายุ (เดือน)</label>
      <input type="number" name="age_months" class="form-control" value="{{ pet.age_remainder }}" min="0" max="11" required>
    </div>

    <div class="col-md-3">
      <label class="form-label">สถานะ</label>
      <select name="status" class="form-select" required>
        <option value="Available" {% if pet.status == 'available' %}selected{% endif %}>Available (ยังหาบ้านอยู่)</option>
        <option value="Adopted" {% if pet.status == 'adopted' %}selected{% endif %}>Adopted (มีบ้านแล้ว)</option>
      </select>
    </div>

    <div class="col-12">
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" id="sterilization_status" name="sterilization_status"
               {% if pet.sterilization_status %}checked{% endif %}>
        <label class="form-check-label" for="sterilization_status">ทำหมันแล้ว</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" id="vaccinated" name="vaccinated"
               {% if pet.vaccinated %}checked{% endif %}>
        <label class="form-check-label" for="vaccinated">ฉีดวัคซีนแล้ว</label>
      </div>
    </div>

    <div class="col-md-6">
      <label class="form-label">จังหวัด</label>
      <input type="text" name="province" class="form-control" value="{{ pet.province }}"
             list="provinceList" placeholder="พิมพ์เพื่อค้นหาจังหวัด" autocomplete="off" required>
      <datalist id="provinceList">
        {% for p in provinces %}
          <option value="{{ p }}">
        {% endfor %}
      </datalist>
    </div>

    <div class="col-12">
      <label class="form-label">รายละเอียด</label>
      <textarea name="description" class="form-control" rows="4">{{ pet.description }}</textarea>
    </div>

    <div class="col-12">
      <button type="submit" class="btn btn-primary">บันทึกการแก้ไข</button>
      <a href="{{ url_for('my_pets') }}" class="btn btn-outline-secondary">ยกเลิก</a>
    </div>

  </form>
</div>
{% endblock %}
