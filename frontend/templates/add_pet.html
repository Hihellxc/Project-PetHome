{% extends "base.html" %}
{% block title %}ลงประกาศสัตว์ - PetHome{% endblock %}

{% block content %}
<h2 class="mb-4">🐾 ลงประกาศสัตว์เลี้ยง</h2>

<div class="form-panel">
  <form method="POST" action="{{ url_for('add_pet') }}" enctype="multipart/form-data" class="row g-3"> <!-- เพิ่ม enctype="multipart/form-data" เพื่อให้สามารถอัปโหลดไฟล์รูปภาพได้ -->
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="col-md-6">
      <label class="form-label">ชื่อสัตว์</label>
      <input type="text" name="name" class="form-control" minlength="2" maxlength="100" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">รูปสัตว์</label>
      <input type="file" name="image" class="form-control" accept="image/*">
    </div>

    <div class="col-md-4">
      <label class="form-label">ประเภท</label>
      <select name="type" class="form-select" required>
        <option value="หมา">หมา</option>
        <option value="แมว">แมว</option>
      </select>
    </div>

    <div class="col-md-4">
      <label class="form-label" for="breed">พันธุ์</label>
            <input type="text" id="breed" name="breed" class="form-control" maxlength="100"
              placeholder="เช่น ไทย, โกลเด้นรีทรีฟเวอร์ (ถ้าไม่ทราบให้เว้นว่าง)">
    </div>

    <div class="col-md-4">
      <label class="form-label">เพศ</label>
      <select name="gender" class="form-select" required>
        <option value="ผู้">ผู้</option>
        <option value="เมีย">เมีย</option>
      </select>
    </div>

    <div class="col-md-4">
      <label class="form-label">อายุ (ปี)</label>
      <input type="number" name="age_years" class="form-control" min="0" required>
    </div>

    <div class="col-md-4">
      <label class="form-label">อายุ (เดือน)</label>
      <input type="number" name="age_months" class="form-control" min="0" max="11" required>
    </div>

    <div class="col-12">
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" id="sterilization_status" name="sterilization_status">
        <label class="form-check-label" for="sterilization_status">ทำหมันแล้ว</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" id="vaccinated" name="vaccinated">
        <label class="form-check-label" for="vaccinated">ฉีดวัคซีนแล้ว</label>
      </div>
    </div>

    <div class="col-md-6">
      <label class="form-label">จังหวัด</label>
      <select name="province" class="form-select" required>
        <option value="" selected disabled>-- เลือกจังหวัด --</option>
        {% for p in provinces %}
          <option value="{{ p }}">{{ p }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="col-12">
      <label class="form-label">รายละเอียด</label>
      <textarea name="description" class="form-control" rows="4" minlength="10" maxlength="2000" required></textarea>
    </div>

    <div class="col-12">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="confirm_info" name="confirm_info" required>
        <label class="form-check-label" for="confirm_info">ยืนยันว่าข้อมูลสัตว์ที่กรอกเป็นความจริง</label>
      </div>
    </div>

    <div class="col-12">
      <button type="submit" class="btn btn-primary">บันทึกประกาศ</button>
    </div>

  </form>
</div>
{% endblock %}
